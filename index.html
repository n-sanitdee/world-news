document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3128fac2-3e2c-4454-b3a1-38b853e94884\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --navy:#16212C; --ink:#0E1720; --teal:#1F6F6B; --gold:#F2D88B;\n    --mint:#F1F4F3; --cream:#F8F7F3; --line:#E3E4E0;\n    --body:#41505C; --muted:#6B7885; --pale:#CAD3D8;\n  }\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #FFFFFF; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: var(--teal); }\n  a:hover { color: var(--navy); }\n  details > summary { list-style: none; cursor: pointer; }\n  details > summary::-webkit-details-marker { display: none; }\n  img, svg { max-width: 100%; }\n  @media print { .no-print { display: none !important; } }\n\n  /* ---------- hero ---------- */\n  .hero { position: relative; background: var(--ink); overflow: hidden; }\n  .hero__bg { position: absolute; inset: 0; }\n  .hero__bg img { width: 100%; height: 100%; object-fit: cover; object-position: 58% 45%; }\n  .hero__bg picture { display: block; position: absolute; inset: 0; }\n  .hero__scrim { position: absolute; inset: 0;\n    background:\n      linear-gradient(103deg, rgba(11,18,25,.95) 0%, rgba(11,18,25,.90) 32%, rgba(11,18,25,.62) 60%, rgba(11,18,25,.32) 100%),\n      linear-gradient(to bottom, rgba(11,18,25,.55) 0%, rgba(11,18,25,0) 24%, rgba(11,18,25,0) 52%, rgba(11,18,25,.82) 100%); }\n  .hero__inner { position: relative; max-width: 1180px; margin: 0 auto;\n    padding: clamp(52px,7.5vw,104px) 20px clamp(96px,11vw,150px); }\n  .hero__badge { display: inline-block; padding: 7px 15px; border-radius: 999px;\n    background: rgba(242,216,139,.14); color: var(--gold); border: 1px solid rgba(242,216,139,.45);\n    font-family: 'IBM Plex Mono','Sarabun',monospace; font-size: 12px; backdrop-filter: blur(4px); }\n  .hero__title { font-family: 'Playfair Display',serif; font-weight: 800;\n    font-size: clamp(44px,9vw,104px); line-height: .96; letter-spacing: -.02em;\n    margin: clamp(18px,3vw,28px) 0 0; color: #fff; text-shadow: 0 2px 28px rgba(0,0,0,.35); }\n  .hero__title span { color: var(--gold); }\n  .hero__hl { display: inline-block; font-weight: 700; font-size: clamp(24px,4.6vw,46px);\n    line-height: 1.5; background: var(--gold); color: var(--navy);\n    padding: 2px clamp(10px,1.6vw,18px) 6px; box-shadow: 0 8px 24px -10px rgba(0,0,0,.6); }\n  .hero__kicker { font-family: 'IBM Plex Mono',monospace; font-size: clamp(11px,1.3vw,13px);\n    letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.72); margin-top: 20px; }\n  .hero__lede { max-width: 640px; font-size: clamp(17px,1.7vw,19px); line-height: 1.8;\n    color: #DCE3E8; margin: 24px 0 0; text-shadow: 0 1px 12px rgba(0,0,0,.4); }\n  .hero__cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }\n  @media (max-width: 760px){\n    /* narrow screens crop the photo hard, so quiet it down behind the copy */\n    .hero__bg img { object-position: 62% 45%; filter: blur(2px); transform: scale(1.04); }\n    .hero__scrim { background:\n      linear-gradient(to bottom, rgba(11,18,25,.90) 0%, rgba(11,18,25,.84) 45%, rgba(11,18,25,.92) 100%); }\n    .hero__lede { text-shadow: 0 1px 16px rgba(0,0,0,.6); }\n  }\n\n  /* ---------- buttons ---------- */\n  .btn { text-decoration: none; font-weight: 700; font-size: 17px; border-radius: 999px;\n    display: inline-block; transition: transform .2s ease, background .2s ease, box-shadow .2s ease, color .2s ease; }\n  .btn:hover { transform: translateY(-2px); }\n  .btn--gold { background: var(--gold); color: var(--navy); padding: 15px 28px;\n    box-shadow: 0 14px 30px -14px rgba(242,216,139,.8); }\n  .btn--gold:hover { background: #fff; color: var(--navy); }\n  .btn--ghost { color: #fff; border: 2px solid rgba(255,255,255,.5); padding: 13px 26px; }\n  .btn--ghost:hover { background: rgba(255,255,255,.12); color: #fff; border-color: #fff; }\n\n  /* ---------- stats (overlap the hero) ---------- */\n  .stats { position: relative; z-index: 2; max-width: 1180px; padding: 0 20px;\n    margin: clamp(-74px,-7.5vw,-58px) auto 0;\n    display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 14px; }\n  .stat { border-radius: 18px; padding: 22px 20px 24px; min-height: 132px;\n    display: flex; flex-direction: column; justify-content: space-between;\n    box-shadow: 0 22px 44px -20px rgba(11,18,25,.60), 0 2px 6px rgba(11,18,25,.10);\n    transition: transform .25s ease, box-shadow .25s ease; }\n  .stat:hover { transform: translateY(-4px); box-shadow: 0 30px 56px -22px rgba(11,18,25,.66), 0 3px 8px rgba(11,18,25,.12); }\n  .stat__k { font-family: 'IBM Plex Mono','Sarabun',monospace; font-size: 12px; opacity: .78; }\n  .stat__v { font-size: clamp(20px,2.2vw,25px); font-weight: 700; line-height: 1.5; }\n\n  /* ---------- figures ---------- */\n  .shot { margin: 0; }\n  .shot picture, .shot > img { display: block; }\n  .shot img { display: block; width: 100%; height: auto; border-radius: 20px; }\n  .shot picture { border-radius: 20px; overflow: hidden; display: block;\n    box-shadow: 0 34px 64px -32px rgba(11,18,25,.50), 0 3px 10px rgba(11,18,25,.09);\n    outline: 1px solid rgba(22,33,44,.07); outline-offset: -1px; }\n  .shot figcaption { font-size: 15px; line-height: 1.8; color: var(--muted);\n    margin-top: 14px; padding-left: 16px; border-left: 4px solid var(--gold); max-width: 760px; }\n  .shot--dark figcaption { color: var(--pale); border-left-color: var(--teal); }\n  .shot--dark picture { box-shadow: 0 34px 64px -30px rgba(0,0,0,.75); outline-color: rgba(255,255,255,.14); }\n\n  /* ---------- cards ---------- */\n  .card { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }\n  .card:hover { transform: translateY(-3px);\n    box-shadow: 0 18px 36px -20px rgba(11,18,25,.34); border-color: #CBD4D1; }\n  .card--dark:hover { box-shadow: 0 18px 36px -18px rgba(0,0,0,.6); border-color: rgba(242,216,139,.55); }\n\n  /* ---------- posters ---------- */\n  .posters { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr));\n    gap: clamp(16px,2.6vw,28px); }\n  .poster { display: block; border-radius: 18px; overflow: hidden; background: #fff;\n    box-shadow: 0 28px 56px -28px rgba(11,18,25,.48), 0 2px 8px rgba(11,18,25,.08);\n    outline: 1px solid rgba(22,33,44,.08); outline-offset: -1px;\n    transition: transform .3s ease, box-shadow .3s ease; }\n  .poster:hover { transform: translateY(-5px);\n    box-shadow: 0 38px 72px -30px rgba(11,18,25,.56), 0 3px 10px rgba(11,18,25,.10); }\n  .poster img { display: block; width: 100%; height: auto; }\n\n  /* ---------- texture ---------- */\n  .tex-dots { background-image: radial-gradient(rgba(22,33,44,.055) 1px, transparent 1px);\n    background-size: 20px 20px; }\n  .tex-dots-dark { background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);\n    background-size: 22px 22px; }\n\n  /* ---------- section heading rule ---------- */\n  .rule { flex: 1; min-width: 80px; height: 12px; background: var(--gold); margin-bottom: 16px; border-radius: 2px; }\n\n  /* ---------- scroll reveal (progressive enhancement only) ---------- */\n  @media (prefers-reduced-motion: no-preference) {\n    @supports (animation-timeline: view()) {\n      .reveal { animation: reveal-up linear both;\n        animation-timeline: view(); animation-range: entry 0% entry 58%; }\n      @keyframes reveal-up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }\n    }\n  }\n\n  /* ---------- main-news callout ---------- */\n  .callout { margin: clamp(28px,4vw,40px) 0 0; background: var(--mint);\n    border: 1px solid var(--line); border-left: 6px solid var(--gold);\n    border-radius: 16px; padding: clamp(20px,2.6vw,26px) clamp(20px,2.6vw,28px); }\n  .callout__h { font-weight: 700; font-size: clamp(18px,2vw,21px); line-height: 1.5;\n    color: var(--navy); margin-bottom: 8px; }\n  .callout__p { font-size: 16px; line-height: 1.85; color: var(--body); margin: 0; }\n\n  /* ---------- project brief: label / content document rows ---------- */\n  .brief-row { display: grid; grid-template-columns: minmax(190px,250px) 1fr;\n    gap: clamp(20px,3vw,48px); padding: clamp(26px,3vw,38px) 0; border-top: 1px solid var(--line); }\n  .brief-row:first-child { border-top: 2px solid var(--navy); }\n  .brief-label { align-self: start; position: sticky; top: 78px; }\n  .brief-num { display: block; font-family: 'IBM Plex Mono',monospace; font-size: 12px;\n    letter-spacing: .12em; color: var(--teal); margin-bottom: 8px; }\n  .brief-label h3 { font-weight: 700; font-size: clamp(18px,2vw,21px); line-height: 1.5; margin: 0; }\n  .brief-body { min-width: 0; }\n  /* cap the measure on prose only, so tables and card grids keep the full column */\n  .brief-body > p { font-size: 16px; line-height: 1.9; color: var(--body); margin: 0 0 14px; max-width: 74ch; }\n  .brief-body > p:last-child { margin-bottom: 0; }\n  .brief-body ul { margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.9; color: var(--body); }\n  .brief-body ul li { margin-bottom: 4px; }\n  .brief-lead { font-size: 17px; line-height: 1.9; color: var(--body);\n    margin: 0 0 clamp(20px,2.5vw,28px); max-width: 860px; }\n  @media (max-width: 860px) {\n    .brief-row { grid-template-columns: 1fr; gap: 14px; padding: 24px 0; }\n    .brief-label { position: static; }\n    .brief-body > p { max-width: none; }\n  }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"font-family:'Sarabun',sans-serif;color:#16212C;font-size:17px;line-height:1.8\">\n\n  <header style=\"position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid #E3E4E0\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n      <a href=\"#top\" style=\"text-decoration:none;color:#16212C;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n        <span style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:19px;letter-spacing:-.01em\">World News &amp; Views<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#6B7885\">EPIC · UTCC<\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display:flex;gap:18px;font-size:15px;font-weight:600;flex-wrap:wrap\">\n        <a href=\"#about\" style=\"text-decoration:none;color:#16212C\">กิจกรรมนี้คืออะไร<\u002Fa>\n        <a href=\"#join\" style=\"text-decoration:none;color:#16212C\">เข้าร่วมยังไง<\u002Fa>\n        <a href=\"#faq\" style=\"text-decoration:none;color:#16212C\">คำถามที่พบบ่อย<\u002Fa>\n        <a href=\"#staff\" style=\"text-decoration:none;color:#1F6F6B\">สำหรับอาจารย์<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" class=\"hero\">\n    <div class=\"hero__bg\">\n      <picture>\n        <source srcset=\"assets/hero-desk.webp\" type=\"image/webp\">\n        <img src=\"assets/hero-desk.jpg\" width=\"1536\" height=\"1024\" alt=\"โต๊ะทำงานริมหน้าต่าง มีหนังสือพิมพ์ภาษาอังกฤษ แล็ปท็อปเปิดหน้าข่าว ลูกโลก และหนังสือหัวข้อ Media Literacy, Critical Thinking, Global Affairs และ Communication\" fetchpriority=\"high\" decoding=\"async\">\n      <\u002Fpicture>\n    <\u002Fdiv>\n    <div class=\"hero__scrim\"><\u002Fdiv>\n    <div class=\"hero__inner\">\n      <span class=\"hero__badge\">โครงการระดับสาขา · ปีการศึกษา 2569<\u002Fspan>\n      <h1 class= ne-height:1.85;color:#41505C;margin:0\">World News &amp; Views คือวงคุยข่าวภาษาอังกฤษแบบสบาย ๆ ที่<strong>นักศึกษาเป็นคนเลือกเนื้อหาเอง<\u002Fstrong> ไม่มีการกำหนดหัวข้อล่วงหน้า คุณเจอข่าวหรือบทความภาษาอังกฤษอะไรที่น่าสนใจ — กีฬา เทคโนโลยี สิ่งแวดล้อม เศรษฐกิจ บันเทิง สังคม อะไรก็ได้ — เอามาเล่าให้เพื่อนฟัง แล้วเราคุยกันต่อ<\u002Fp>\n      <p style=\"font-size:17px;line-height:1.85;color:#41505C;margin:0;padding-left:24px;border-left:4px solid #F2D88B\">แต่ละครั้งใช้เวลาประมาณหนึ่งชั่วโมง มีคนเข้าร่วมไม่เกิน 20 คน เพื่อให้ทุกคนได้พูดจริง ๆ ไม่ใช่แค่นั่งฟัง คุณจะมาในฐานะ<strong>ผู้นำเสนอ<\u002Fstrong> (เตรียมข่าวมาเล่า) หรือ<strong>ผู้ร่วมฟังและร่วมคุย<\u002Fstrong> ก็ได้ทั้งคู่ <strong>การนำเสนอไม่บังคับ<\u002Fstrong> จะมาคนเดียวหรือชวนเพื่อนมาเป็นกลุ่มก็ได้ และถ้าอยากนำเสนอ จะนำเสนอเดี่ยวหรือรวมกลุ่มกับเพื่อนก็ได้เช่นกัน<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"callout reveal\">\n      <div class=\"callout__h\">ทุกครั้งมีข่าวหลักจากผู้จัด<\u002Fdiv>\n      <p class=\"callout__p\">แต่ละสัปดาห์ผู้จัดจะเตรียม<strong>ข่าวหลักมาหนึ่งข่าว<\u002Fstrong> เพื่อให้มีประเด็นร่วมให้ทุกคนได้คุยกันเสมอ แม้สัปดาห์นั้นจะไม่มีใครนำเสนอ ส่วนข่าวที่นักศึกษาอยากเล่าเองเป็นส่วนเสริมที่เปิดรับตลอด — จะนำเสนอคนเดียวหรือรวมกลุ่มกับเพื่อนก็ได้<\u002Fp>\n    <\u002Fdiv>\n    <figure class=\"shot reveal\" style=\"margin:clamp(34px,4.5vw,52px) 0 0\">\n      <picture>\n        <source srcset=\"assets/students.webp\" type=\"image/webp\">\n        <img src=\"assets/students.jpg\" width=\"1165\" height=\"520\" alt=\"นักศึกษาสี่คนนั่งคุยกันรอบโต๊ะ มีหนังสือพิมพ์ แล็ปท็อป และลูกโลกอยู่ด้านหลัง พร้อมกรอบคำพูดหัวข้อ Current Events, Global Issues, Conspiracy Theories และ Misinformation\" loading=\"lazy\" decoding=\"async\">\n      <\u002Fpicture>\n      <figcaption>วงคุยจริง ๆ ไม่ใช่ห้องบรรยาย — ทุกคนได้พูด ได้ถาม และได้ฟังมุมที่ต่างจากตัวเอง<\u002Ffigcaption>\n    <\u002Ffigure>\n    <h3 style=\"font-weight:700;font-size:clamp(21px,2.4vw,26px);line-height:1.5;margin:clamp(36px,5vw,56px) 0 20px\">ได้อะไรกลับไปบ้าง<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px\">\n      <sc-for list=\"{{ gains }}\" as=\"g\" hint-placeholder-count=\"4\">\n        <div class=\"card\" style=\"border:1px solid #E3E4E0;border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#1F6F6B\">{{ g.n }}<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.8;color:#41505C\">{{ g.pre }}<strong style=\"color:#16212C\">{{ g.b }}<\u002Fstrong>{{ g.post }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size:17px;line-height:1.85;color:#41505C;max-width:900px;margin:32px 0 0\">เรื่องที่เอามาคุยได้มีตั้งแต่ข่าวทั่วไปในแต่ละสัปดาห์ ไปจนถึงข้อมูลที่กำลังแชร์กันบนโซเชียลแล้วยังไม่รู้ว่าจริงหรือเปล่า ส่วนหนึ่งของกิจกรรมคือการช่วยกันดูว่า <em style=\"color:#1F6F6B;font-style:normal;font-weight:700\">ข่าวนี้มาจากไหน ใครเป็นคนพูด มีหลักฐานอะไรรองรับ<\u002Fem> ซึ่งเป็นทักษะที่ใช้ได้ทั้งในห้องเรียนและในชีวิตประจำวัน<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"join\" class=\"tex-dots-dark\" style=\"margin-top:clamp(48px,7vw,80px);background:#16212C;color:#fff\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:clamp(40px,6vw,72px) 20px\">\n      <div style=\"display:flex;align-items:flex-end;gap:20px;margin-bottom:clamp(28px,4vw,44px);flex-wrap:wrap\">\n        <div>\n          <span style=\"font-family:'IBM Plex Mono','Sarabun',monospace;font-size:12px;color:#F2D88B\">สำหรับนักศึกษา<\u002Fspan>\n          <h2 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(30px,4vw,44px);line-height:1.05;margin:10px 0 0\">How it works<\u002Fh2>\n          <div style=\"font-weight:700;font-size:clamp(24px,3.4vw,38px);line-height:1.5;color:#F2D88B\">เข้าร่วมยังไง<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:80px;height t-weight:600\">{{ f.n }}<\u002Fspan>{{ f.q }}\n            <\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.85;color:#41505C;margin-top:12px;padding-left:34px\">{{ f.a }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"posters\" style=\"max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,76px) 20px clamp(8px,1vw,16px)\">\n    <div style=\"display:flex;align-items:flex-end;gap:20px;margin-bottom:32px;flex-wrap:wrap\">\n      <div>\n        <span style=\"font-family:'IBM Plex Mono','Sarabun',monospace;font-size:12px;color:#1F6F6B\">สำหรับนักศึกษา<\u002Fspan>\n        <h2 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(30px,4vw,44px);line-height:1.05;margin:10px 0 0\">Spread the word<\u002Fh2>\n        <div style=\"font-weight:700;font-size:clamp(24px,3.4vw,38px);line-height:1.5;color:#1F6F6B\">ชวนเพื่อนมาด้วยกัน<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rule\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:17px;line-height:1.85;color:#41505C;max-width:760px;margin:0 0 28px\">บันทึกโปสเตอร์ไปแชร์ต่อในกลุ่มเรียนหรือโซเชียลได้เลย คลิกที่ภาพเพื่อเปิดไฟล์ขนาดเต็ม<\u002Fp>\n    <div class=\"posters reveal\">\n      <a class=\"poster\" href=\"assets/poster-editorial.jpg\" target=\"_blank\" rel=\"noopener\">\n        <picture>\n          <source srcset=\"assets/poster-editorial.webp\" type=\"image/webp\">\n          <img src=\"assets/poster-editorial.jpg\" width=\"1536\" height=\"1024\" alt=\"โปสเตอร์ World News &amp; Views แบบภาพถ่าย พร้อมคำโปรย Same world. Different perspectives. และแถบทักษะห้าด้าน\" loading=\"lazy\" decoding=\"async\">\n        <\u002Fpicture>\n      <\u002Fa>\n      <a class=\"poster\" href=\"assets/poster-community.jpg\" target=\"_blank\" rel=\"noopener\">\n        <picture>\n          <source srcset=\"assets/poster-community.webp\" type=\"image/webp\">\n          <img src=\"assets/poster-community.jpg\" width=\"1536\" height=\"1024\" alt=\"โปสเตอร์ World News &amp; Views แบบภาพวาด นักศึกษานั่งคุยข่าวรอบลูกโลก พร้อมไอคอนทักษะหกด้าน\" loading=\"lazy\" decoding=\"async\">\n        <\u002Fpicture>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"position:relative;background:#16212C;color:#fff;padding:44px 20px\">\n    <div style=\"position:absolute;top:0;left:0;right:0;height:4px;background:#F2D88B\"><\u002Fdiv>\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:24px;flex-wrap:wrap\">\n      <span style=\"font-family:'IBM Plex Mono','Sarabun',monospace;font-size:12px;color:#F2D88B\">สำหรับอาจารย์ผู้ร่วมโครงการ<\u002Fspan>\n      <span style=\"flex:1;min-width:40px;height:1px;background:rgba(255,255,255,.25)\"><\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#CAD3D8\">↓ project brief<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section id=\"staff\" style=\"max-width:1180px;margin:0 auto;padding:clamp(40px,6vw,64px) 20px 0\">\n    <div style=\"display:flex;align-items:flex-end;gap:20px;margin-bottom:clamp(22px,3vw,34px);flex-wrap:wrap\">\n      <div>\n        <span style=\"font-family:'IBM Plex Mono','Sarabun',monospace;font-size:12px;color:#1F6F6B\">สำหรับอาจารย์<\u002Fspan>\n        <h2 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(28px,3.6vw,40px);line-height:1.05;margin:10px 0 0\">Project brief<\u002Fh2>\n        <div style=\"font-weight:700;font-size:clamp(22px,3vw,32px);line-height:1.5;color:#1F6F6B\">รายละเอียดโครงการ<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rule\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"brief\">\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">01<\u002Fspan><h3>หลักการและเหตุผล<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <p>โครงการ World News &amp; Views จัดขึ้นเพื่อส่งเสริมการเรียนรู้ภาษาอังกฤษผ่านข่าวสาร เหตุการณ์ และประเด็นร่วมสมัยจากทั่วโลก โดยเน้นการเรียนรู้จากความสนใจของนักศึกษาเป็นหลัก นักศึกษาสามารถเลือกข่าวหรือบทความภาษาอังกฤษที่ตนเองสนใจจากแหล่งข้อมูลต่าง ๆ และนำมาแบ่งปัน นำเสนอ และอภิปรายร่วมกับเพื่อน<\u002Fp>\n          <p>กิจกรรมมุ่งเน้นการใช้ภาษาอังกฤษในบริบทที่ใกล้เคียงกับการใช้งานจริง โดยเปิดโอกาสให้นักศึกษาได้ฝึกการอ่านและการอ่านออกเสียง การจับใจความ การสรุปข้อมูล การจัดทำ Presentation การนำเสนอ การตั้งคำถาม และการแสดงความคิดเห็น รวมถึงการสื่อสารและแลกเปลี่ยนความคิดเห็นกับผู้อื่น<\u002Fp>\n          <p>นอกจากนี้ กิจกรรมยังส่งเสริม <strong>Critical Thinking<\u002Fstrong> และ <strong>Media and Information Literacy<\u002Fstrong> ผ่านการวิเคราะห์ข่าวและข้อมูลที่ได้รับ นักศึกษาจะได้ฝึกพิจารณาแหล่งที่มา ความน่าเชื่อถือของข้อมูล แยกข้อเท็จจริงออกจากความคิดเห็นหรือข้อกล่าวอ้าง ตรวจสอบข้อมูลที่แพร่กระจายบนสื่อสังคมออนไลน์โดยยังไม่ได้รับการยืนยัน และพิจารณาข้อมูลจากมุมมองที่หลากหลาย เพื่อให้สามารถรับและประเมินข่าวสารได้อย่างมีวิจารณญาณ<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">02<\u002Fspan><h3>วัตถุประสงค์<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 32px\">\n            <sc-for list=\"{{ objectives }}\" as=\"o\" hint-placeholder-count=\"9\">\n              <div style=\"display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #EBECE8\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#1F6F6B;font-weight:600\">{{ o.n }}<\u002Fspan>\n                <span style=\"font-size:15px;line-height:1.8;color:#41505C\">{{ o.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">03<\u002Fspan><h3>กลุ่มเป้าหมาย<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <ul>\n            <li>นักศึกษารายวิชา <strong>GE5072 Business English for International Communication<\u002Fstrong> กลุ่มที่สอนโดย อ.ณัฎชนันท์ สนิทดี<\u002Fli>\n            <li>นักศึกษาทุกชั้นปีและทุกสาขาที่สนใจ<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">04<\u002Fspan><h3>รูปแบบและการจัดกิจกรรม<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <ul>\n            <sc-for list=\"{{ formats }}\" as=\"ft\" hint-placeholder-count=\"8\"><li>{{ ft }}<\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">05<\u002Fspan><h3>ทักษะที่มุ่งพัฒนา<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px\">\n            <sc-for list=\"{{ skills }}\" as=\"sk\" hint-placeholder-count=\"4\">\n              <div class=\"card\" style=\"background:#F1F4F3;border:1px solid #E3E4E0;border-radius:14px;padding:18px 16px\">\n                <div style=\"font-size:14px;font-weight:700;color:#1F6F6B;line-height:1.5;margin-bottom:10px\">{{ sk.group }}<\u002Fdiv>\n                <sc-for list=\"{{ sk.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                  <div style=\"font-size:14px;line-height:1.9;color:#41505C\">{{ it }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">06<\u002Fspan><h3>ตัวชี้วัดความสำเร็จ<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <div style=\"border:1px solid #E3E4E0;border-radius:14px;overflow:hidden\">\n            <div style=\"display:grid;grid-template-columns:minmax(140px,240px) 1fr;background:#16212C;color:#fff;font-family:'IBM Plex Mono','Sarabun',monospace;font-size:12px\">\n              <div style=\"padding:12px 18px\">ตัวชี้วัด<\u002Fdiv><div style=\"padding:12px 18px\">เป้าหมาย<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"10\">\n              <div style=\"display:grid;grid-template-columns:minmax(140px,240px) 1fr;border-top:1px solid #EBECE8;background:{{ k.bg }}\">\n                <div style=\"padding:12px 18px;font-size:15px;font-weight:600;line-height:1.7\">{{ k.k }}<\u002Fdiv>\n                <div style=\"padding:12px 18px;font-size:15px;line-height:1.7;color:#41505C\">{{ k.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">07<\u002Fspan><h3>การประเมินผล<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <ul>\n            <sc-for list=\"{{ evals }}\" as=\"e\" hint-placeholder-count=\"6\"><li>{{ e }}<\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"committee\" class=\"tex-dots\" style=\"margin-top:clamp(40px,6vw,64px);background:#F8F7F3;border-top:1px solid #E3E4E0\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:clamp(40px,6vw,56px) 20px clamp(48px,6vw,64px)\">\n    <div style=\"display:flex;align-items:flex-end;gap:20px;margin-bottom:clamp(22px,3vw,34px);flex-wrap:wrap\">\n      <div>\n        <span style=\"font-family:'IBM Plex Mono','Sarabun',monospace;font-size:12px;color:#1F6F6B\">สำหรับอาจารย์<\u002Fspan>\n        <h2 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(28px,3.6vw,40px);line-height:1.05;margin:10px 0 0\">What joining involves<\u002Fh2>\n        <div style=\"font-weight:700;font-size:clamp(22px,3vw,32px);line-height:1.5;color:#1F6F6B\">บทบาทคณะกรรมการ<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rule\"><\u002Fdiv>\n    <\u002Fdiv>\n      <p class=\"brief-lead\">กิจกรรมนี้ขับเคลื่อนโดยนักศึกษาเป็นหลัก อาจารย์ทำหน้าที่ดูแลกรอบและคุณภาพ ไม่ใช่สอนหรือคุมห้องทุกสัปดาห์<\u002Fp>\n\n      <div class=\"brief\">\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">01<\u002Fspan><h3>ภาระงานโดยประมาณ<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px\">\n            <sc-for list=\"{{ loads }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div class=\"card\" style=\"background:#fff;border:1px solid #E3E4E0;border-radius:14px;padding:20px 18px\">\n                <div style=\"font-size:16px;font-weight:700;line-height:1.6;margin-bottom:8px\">{{ l.b }}<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.8;color:#41505C\">{{ l.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">02<\u002Fspan><h3>ฝ่ายและหน้าที่<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <div style=\"border:1px solid #E3E4E0;border-radius:14px;overflow:hidden;background:#fff\">\n            <div style=\"display:grid;grid-template-columns:minmax(140px,240px) 1fr;background:#16212C;color:#fff;font-family:'IBM Plex Mono','Sarabun',monospace;font-size:12px\">\n              <div style=\"padding:12px 18px\">ฝ่าย<\u002Fdiv><div style=\"padding:12px 18px\">หน้าที่<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:minmax(140px,240px) 1fr;border-top:1px solid #EBECE8\">\n                <div style=\"padding:14px 18px;font-size:15px;font-weight:600;line-height:1.7;background:#F8F7F3\">{{ r.d }}<\u002Fdiv>\n                <div style=\"padding:14px 18px;font-size:15px;line-height:1.7;color:#41505C\">{{ r.t }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"brief-row\">\n        <div class=\"brief-label\"><span class=\"brief-num\">03<\u002Fspan><h3>ความสอดคล้องกับ KPI ของสาขา<\u002Fh3><\u002Fdiv>\n        <div class=\"brief-body\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px\">\n            <sc-for list=\"{{ kpiAlign }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div style=\"padding:16px 18px;border-left:4px solid #1F6F6B;background:#fff\">\n                <div style=\"font-size:16px;font-weight:700;line-height:1.6\">{{ a.b }}<\u002Fdiv>\n                <div style=\"font-size:15px;line-height:1.8;color:#41505C;margin-top:6px\">{{ a.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:20px;font-family:'IBM Plex Mono','Sarabun',monospace;font-size:13px;line-height:1.9;color:#6B7885;background:#F1F4F3;border-radius:10px;padding:14px 18px\">รายชื่อคณะกรรมการอยู่ระหว่างการเชิญ จะปรับปรุงหน้านี้เมื่อครบถ้วน<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#16212C;color:#CAD3D8;padding:clamp(36px,5vw,48px) 20px\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:#F2D88B\">World News &amp; Views<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.9;margin-top:8px\"><strong style=\"color:#fff\">World News &amp; Views (ข่าวโลก มุมมองเรา)<\u002Fstrong><br>โครงการระดับสาขา ปีการศึกษา 2569 · สาขาวิชาภาษาอังกฤษเพื่ออาชีพและการสื่อสารนานาชาติ (EPIC)<br>คณะมนุษยศาสตร์ มหาวิทยาลัยหอการค้าไทย<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono','Sarabun',monospace;font-size:13px;margin-top:16px;color:#F2D88B\">ผู้ประสานงาน: อาจารย์ณัฎชนันท์ สนิทดี · <a href=\"{{ mailto }}\" style=\"color:#F2D88B\">{{ contactEmail }}<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;formUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=gnzLDoQbNkut7yCBtcESWyjigmG60oVCkbr2GDluZkBUMEc0TzFZUVBUWERCNzkwSFZGRVA0QzhBNC4u&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;pollUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;contactEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;natchanun_san@utcc.ac.th&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props;\n    const formUrl = p.formUrl || 'https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=gnzLDoQbNkut7yCBtcESWyjigmG60oVCkbr2GDluZkBUMEc0TzFZUVBUWERCNzkwSFZGRVA0QzhBNC4u';\n    const pollUrl = p.pollUrl || '#';\n    const contactEmail = p.contactEmail || 'natchanun_san@utcc.ac.th';\n\n    const stats = [\n      {k:'ความถี่', v:'ทุกสัปดาห์ · ครั้งละ 1 ชม.', bg:'#1F6F6B', fg:'#FFFFFF', bd:'#1F6F6B'},\n      {k:'จำนวน', v:'ไม่เกิน 20 คน/ครั้ง', bg:'#F2D88B', fg:'#16212C', bd:'#E8CB74'},\n      {k:'รูปแบบ', v:'On-site หรือ Online', bg:'#F1F4F3', fg:'#16212C', bd:'#E3E4E0'},\n      {k:'เปิดรับ', v:'ทุกชั้นปี ทุกสาขา', bg:'#16212C', fg:'#FFFFFF', bd:'#16212C'}\n    ];\n\n    const steps = [\n      ['01','เลือกข่าวที่คุณสนใจ','ถ้าอยากนำเสนอ เลือกข่าวหรือบทความภาษาอังกฤษจากแหล่งไหนก็ได้ที่ตรวจสอบย้อนกลับได้ ความยาวไม่จำกัด ขอแค่คุณอยากเล่าให้คนอื่นฟัง ถ้ายังไม่อยากนำเสนอ ข้ามไปข้อ 02 ได้เลย'],\n      ['02','ลงชื่อและส่งหัวข้อ','แจ้งว่าจะมาร่วมฟังเฉย ๆ หรือจะเป็นผู้นำเสนอ ถ้าจะนำเสนอให้ระบุข่าวที่เลือก และจะเดี่ยวหรือรวมกลุ่มกับเพื่อนก็ได้'],\n      ['03','โหวตเวลาที่สะดวก','เราจะส่ง Online Poll ให้เลือกช่วงเวลาในสัปดาห์นั้น ไม่ได้ล็อกวันเวลาตายตัว เพราะตารางเรียนแต่ละคนไม่เหมือนกัน'],\n      ['04','รอยืนยันตาราง','วัน เวลา และรูปแบบ (On-site หรือ Online) จะยืนยันให้ทราบภายในวันอาทิตย์ก่อนสัปดาห์ที่จัด'],\n      ['05','เริ่มด้วยข่าวหลักของสัปดาห์','ผู้จัดเตรียมข่าวหลักมาหนึ่งข่าวทุกครั้ง เพื่อให้ทุกคนมีประเด็นร่วมให้คุยกัน แม้สัปดาห์นั้นจะไม่มีใครนำเสนอ'],\n      ['06','นำเสนอข่าวของคุณ (ถ้ามี)','เล่าว่าข่าวนี้เกี่ยวกับอะไร มาจากไหน และทำไมคุณถึงเลือกมัน เดี่ยวหรือกลุ่มก็ได้ ไม่ต้องเป๊ะ ไม่ต้องท่อง ผิดได้'],\n      ['07','คุยกันต่อ','คนอื่นถามคำถาม แลกเปลี่ยนความเห็น เห็นต่างได้ ไม่มีคำตอบถูกผิด'],\n      ['08','ช่วยกันตรวจสอบ','ดูด้วยกันว่าข้อมูลน่าเชื่อถือแค่ไหน แหล่งข่าวเป็นใคร มีมุมอื่นที่ยังไม่ได้พูดถึงไหม'],\n      ['09','เก็บผลงานเข้า Portfolio','สไลด์ บทสรุปข่าว คำศัพท์ คำถามที่คุณตั้ง และ Reflection สั้น ๆ เก็บสะสมไว้ใช้ต่อได้']\n    ].map(([n,t,d]) => ({n,t,d}));\n\n    const faqs = [\n      ['ภาษาอังกฤษไม่เก่ง มาร่วมได้ไหม','ได้ และนี่คือกลุ่มเป้าหมายหลักเลย กิจกรรมนี้ไม่ได้วัดว่าใครเก่งกว่าใคร ไม่มีคะแนน ไม่มีการตัดสิน เป้าหมายคือให้ได้ใช้ภาษาอังกฤษบ่อย ๆ ในบรรยากาศที่พูดผิดได้ ถ้าติดขัดตรงไหนสลับเป็นภาษาไทยได้'],\n      ['ต้องมาทุกสัปดาห์ไหม','ไม่ต้อง มาเฉพาะสัปดาห์ที่ว่างและสนใจหัวข้อก็ได้ ไม่มีการเช็กชื่อสะสม แต่ถ้ามาสม่ำเสมอจะเก็บ Portfolio ได้ครบกว่า'],\n      ['ต้องนำเสนอทุกครั้งไหม','ไม่ต้อง การนำเสนอเป็นความสมัครใจล้วน ๆ ทุกครั้งจะมีข่าวหลักที่ผู้จัดเตรียมมาอยู่แล้ว มาฟังและร่วมคุยอย่างเดียวก็ได้ จะนำเสนอเมื่อไหร่ค่อยแจ้งตอนลงทะเบียนสัปดาห์นั้น'],\n      ['นำเสนอเป็นกลุ่มได้ไหม','ได้ รวมกลุ่มกับเพื่อน 2–3 คนแล้วช่วยกันนำเสนอข่าวเดียวกันก็ได้ จะแบ่งกันพูดคนละช่วงหรือช่วยกันตอบคำถามก็ได้ ตอนลงทะเบียนระบุชื่อสมาชิกในกลุ่มมาได้เลย'],\n      ['ต้องทำสไลด์ไหม เตรียมนานไหม','ไม่บังคับ จะเปิดหน้าข่าวให้ดูเฉย ๆ ก็ได้ ถ้าทำสไลด์ 3–5 หน้าก็พอ ส่วนใหญ่ใช้เวลาเตรียมประมาณ 20–30 นาที'],\n      ['เลือกข่าวแนวไหนได้บ้าง','อะไรก็ได้ที่เป็นภาษาอังกฤษและตรวจสอบแหล่งที่มาได้ กีฬา เกม เทคโนโลยี ศิลปะ สิ่งแวดล้อม ธุรกิจ สุขภาพ วัฒนธรรมป๊อป ไปจนถึงข่าวที่กำลังเป็นที่ถกเถียง ขอแค่บอกได้ว่าเอามาจากไหน'],\n      ['เป็นนักศึกษาสาขาอื่น / ชั้นปีอื่น มาได้ไหม','ได้ เปิดรับทุกชั้นปีทุกสาขา ไม่จำเป็นต้องเรียนวิชา GE5072 หรืออยู่สาขา EPIC'],\n      ['Portfolio เอาไปใช้อะไรได้','ใช้ประกอบการสมัครงาน สมัครฝึกงาน สมัครทุน หรือสมัครเรียนต่อได้ เพราะเป็นหลักฐานว่าคุณใช้ภาษาอังกฤษนำเสนอและวิเคราะห์ข้อมูลได้จริง ไม่ใช่แค่ใบเกรด']\n    ].map(([q,a],i) => ({q,a,n:'0'+(i+1),open:i===0}));\n\n    const gains = [\n      {n:'01',pre:'ได้ฝึก ',b:'อ่าน อ่านออกเสียง จับใจความ สรุป และนำเสนอ',post:' เป็นภาษาอังกฤษในสถานการณ์จริง'},\n      {n:'02',pre:'ได้ฝึก ',b:'ตั้งคำถามและแสดงความเห็น',post:' ต่อหน้าคนอื่น ทั้งแบบเจอตัวและแบบออนไลน์'},\n      {n:'03',pre:'ได้ฝึก ',b:'ดูให้ออกว่าข้อมูลไหนเชื่อได้',post:' — ตรวจแหล่งที่มา แยกข้อเท็จจริงออกจากความเห็น และมองหลายมุม'},\n      {n:'04',pre:'ได้ ',b:'ผลงานสะสมเป็น Portfolio',post:' ที่ใช้สมัครงาน สมัครเรียนต่อ หรือสมัครทุนได้จริง'}\n    ];\n\n    const objectives = [\n      'เพื่อส่งเสริมการใช้ภาษาอังกฤษเพื่อการสื่อสารในสถานการณ์และประเด็นที่ใกล้เคียงกับชีวิตจริง',\n      'เพื่อพัฒนาทักษะการอ่าน การอ่านออกเสียง การจับใจความ และการสรุปสาระสำคัญจากข่าวภาษาอังกฤษ',\n      'เพื่อพัฒนาทักษะการพูด การนำเสนอ และการสื่อสารต่อหน้าผู้อื่น รวมถึงการสื่อสารผ่านช่องทางออนไลน์',\n      'เพื่อส่งเสริมทักษะการค้นคว้า คัดเลือก และเรียบเรียงข้อมูลจากแหล่งข้อมูลต่าง ๆ',\n      'เพื่อพัฒนาทักษะการอภิปราย การตั้งคำถาม และการแลกเปลี่ยนความคิดเห็น',\n      'เพื่อส่งเสริม Critical Thinking และความสามารถในการวิเคราะห์ข้อมูลอย่างมีเหตุผล',\n      'เพื่อส่งเสริม Media and Information Literacy และการรับข่าวสารอย่างรู้เท่าทัน',\n      'เพื่อสร้างพื้นที่การเรียนรู้ร่วมกันสำหรับนักศึกษาที่มีความสนใจและมุมมองที่หลากหลาย',\n      'เพื่อเปิดโอกาสให้นักศึกษาสะสมผลงานและหลักฐานการเรียนรู้เพื่อจัดทำเป็น Portfolio'\n    ].map((t,i) => ({t, n:'0'+(i+1)}));\n\n    const formats = [\n      'ลักษณะ Student-led and Flexible Learning ไม่กำหนด Theme หรือหัวข้อข่าวล่วงหน้า',\n      'จัดทุกสัปดาห์ อย่างน้อยสัปดาห์ละ 1 ชั่วโมง',\n      'วันและเวลาไม่กำหนดตายตัว พิจารณาจากความสะดวกของผู้เข้าร่วมผ่าน Online Poll',\n      'ยืนยันวัน เวลา และรูปแบบล่วงหน้าภายในวันอาทิตย์ของสัปดาห์ที่จะถึง',\n      'จัดได้ทั้ง On-site และ Online เพื่อให้ฝึกการสื่อสารทั้งแบบเผชิญหน้าและผ่านช่องทางดิจิทัล',\n      'ทุกครั้งมีข่าวหลักที่ผู้จัดเตรียมมาเป็นประเด็นร่วมของวง การนำเสนอของนักศึกษาเป็นความสมัครใจ',\n      'ผู้เข้าร่วมไม่เกิน 20 คนต่อครั้ง นำเสนอเดี่ยวหรือเป็นกลุ่มก็ได้',\n      'หากมีผู้สนใจเกินจำนวน จะจัดลำดับให้เข้าร่วมในครั้งถัดไป'\n    ];\n\n    const skills = [\n      {group:'English Communication', items:['Reading','Reading Aloud / Pronunciation','Listening','Speaking','Presentation Skills','Discussion and Interaction']},\n      {group:'Academic & Information', items:['Reading Comprehension','Summarising','Information Searching','Source Evaluation','Information Synthesis']},\n      {group:'Higher-order Thinking', items:['Critical Thinking','Questioning','Analysis','Evaluation','Evidence-based Reasoning']},\n      {group:'Digital & Media Literacy', items:['Media and Information Literacy','Fact-checking','Evaluating Online Information','Digital Communication']}\n    ];\n\n    const kpis = [\n      ['การจัดกิจกรรม','จัดได้อย่างน้อย 1 ครั้งต่อสัปดาห์'],\n      ['การเข้าร่วม','มีนักศึกษาเข้าร่วมตามความสนใจ ไม่เกิน 20 คนต่อครั้ง'],\n      ['การนำเสนอ','นักศึกษาที่แจ้งความประสงค์นำเสนอได้นำเสนอข่าวที่เลือก'],\n      ['การมีส่วนร่วม','ผู้เข้าร่วมตั้งคำถาม อภิปราย หรือแลกเปลี่ยนความคิดเห็น'],\n      ['ทักษะภาษาอังกฤษ','นักศึกษารายงานว่ามีความมั่นใจในการอ่าน พูด และนำเสนอเพิ่มขึ้น'],\n      ['Critical Thinking','นักศึกษาแสดงความคิดเห็นโดยมีเหตุผลหรือข้อมูลสนับสนุน'],\n      ['Media Literacy','นักศึกษาพิจารณาแหล่งที่มาและความน่าเชื่อถือของข้อมูลได้'],\n      ['Presentation Skills','นักศึกษานำเสนออย่างเป็นระบบและสื่อสารประเด็นสำคัญได้'],\n      ['Portfolio','นักศึกษามีผลงานหรือหลักฐานการเรียนรู้ที่รวบรวมเป็น Portfolio ได้'],\n      ['ความพึงพอใจ','ค่าเฉลี่ยไม่น้อยกว่า 4.00 จาก 5.00']\n    ].map(([k,v],i) => ({k,v,bg: i%2 ? '#F8F7F3' : '#FFFFFF'}));\n\n    const evals = [\n      'แบบประเมินความพึงพอใจหลังเข้าร่วมกิจกรรม',\n      'Self-assessment ก่อนและหลังเข้าร่วม เพื่อสะท้อนพัฒนาการด้านภาษาและการสื่อสาร',\n      'การสังเกตการมีส่วนร่วมในการนำเสนอ การอภิปราย และการตั้งคำถาม',\n      'การประเมินการนำเสนอด้วย Presentation Rubric',\n      'การเก็บข้อมูลจำนวนผู้เข้าร่วมและความถี่ในการเข้าร่วม',\n      'การรวบรวมผลงานเป็น Learning Portfolio (News Presentation, Slides, News Summary, Vocabulary, Discussion Questions, Fact-checking / Source Evaluation, Personal Reflection)'\n    ];\n\n    const loads = [\n      {b:'ไม่ต้องเข้าร่วมทุกสัปดาห์', d:'หมุนเวียนกันเข้าร่วมตามสะดวก เฉลี่ยประมาณเดือนละ 1–2 ครั้งต่อคน'},\n      {b:'ประชุมคณะกรรมการ 2–3 ครั้งต่อภาคการศึกษา', d:'วางแผนต้นเทอม ทบทวนกลางเทอม สรุปผลปลายเทอม'},\n      {b:'งานเอกสารรวมศูนย์ที่ประธาน', d:'การประชาสัมพันธ์ Poll การยืนยันตาราง และการรวบรวมข้อมูลรายสัปดาห์'}\n    ];\n\n    const roles = [\n      ['ประธานโครงการ','ประสานงานภาพรวม ดำเนินกิจกรรมรายสัปดาห์ จัด Online Poll ยืนยันตาราง และรวบรวมผลการดำเนินงาน'],\n      ['ประชาสัมพันธ์และรับสมัคร','ประกาศกิจกรรม ดูแลแบบฟอร์มลงทะเบียน และติดตามจำนวนผู้เข้าร่วม'],\n      ['วิชาการและ Rubric','จัดทำ Presentation Rubric และแบบ Self-assessment ก่อน–หลัง'],\n      ['Media Literacy','จัดทำแนวทางการตรวจสอบแหล่งข้อมูลและ Fact-checking สำหรับใช้ในวงอภิปราย'],\n      ['Portfolio','จัดทำเทมเพลตและแนวทางการรวบรวมผลงานของนักศึกษา'],\n      ['ประเมินผลและรายงาน','แบบประเมินความพึงพอใจ การเก็บข้อมูล และรายงานสรุปส่งสาขา']\n    ].map(([d,t]) => ({d,t}));\n\n    const kpiAlign = [\n      {b:'การดูแลนักศึกษาตกออก', d:'เพิ่มพื้นที่ใช้ภาษาอังกฤษนอกห้องเรียนอย่างต่อเนื่องตลอดปีการศึกษา โดยไม่เพิ่มภาระด้านคะแนน'},\n      {b:'กิจกรรมพัฒนานักศึกษา (
